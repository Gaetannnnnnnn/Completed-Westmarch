<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Épingle fine plantée dans la carte : la pointe est au CENTRE de l'image
       (point exact de la note). L'aiguille sort en biais, tête ronde. -->
  <defs>
    <radialGradient id="tete" cx=".35" cy=".35" r=".75">
      <stop offset="0" stop-color="#ffb3a8"/>
      <stop offset=".35" stop-color="#d6352a"/>
      <stop offset="1" stop-color="#6e0f0a"/>
    </radialGradient>
    <linearGradient id="acier" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d646b"/>
      <stop offset=".5" stop-color="#e9edf0"/>
      <stop offset="1" stop-color="#5d646b"/>
    </linearGradient>
  </defs>
  <!-- ombre portée sur la carte -->
  <path d="M32 32 L49 27" stroke="#000" stroke-opacity=".35" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="51" cy="26.5" r="5" fill="#000" opacity=".25"/>
  <!-- trou où l'aiguille entre dans la carte -->
  <ellipse cx="32" cy="32" rx="2.4" ry="1.3" fill="#000" opacity=".6"/>
  <!-- aiguille -->
  <path d="M32 32 L45 15" stroke="#1d2125" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M32 32 L45 15" stroke="url(#acier)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- tête -->
  <circle cx="46.5" cy="13" r="6" fill="url(#tete)" stroke="#3a0705" stroke-width="1.2"/>
  <circle cx="44.6" cy="11" r="1.6" fill="#fff" opacity=".8"/>
</svg>
